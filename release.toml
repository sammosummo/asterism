[[analyses.pass_rules]]
id = "censored_components_coverage"
command = [
  "checks/censored_components_coverage.py",
  "--replicates", "300",
  "--workers", "12",
  "--no-write",
]
expected_exit_code = 0
timeout_seconds = 21600
status = "ready"
# `nominal_coverage` is 0.975 rather than 0.95 and that is not a loosened rule.
# A component proportion of one leaves a person's own records perfectly
# correlated, so the covariance is singular, the profile cannot be evaluated at
# the upper bound and the interval covers that end rather than placing it on
# evidence never gathered. A two-sided 95 per cent interval puts 0.025 in each
# tail; closing the upper one off hands that back, which makes 0.975 what the
# lower end can be held to.
#
# The band is simultaneous across the twelve cells rather than drawn at 95 per
# cent for each. Twelve independent bands are excluded by chance somewhere 46
# per cent of the time, so a per-cell rule would fail about every other run of a
# model with nothing wrong with it.
design_facts = { participant_free = true, sample_size = { min = 4800, max = 4800 }, people = 2400, records_per_person = 2, largest_family = { max = 2 }, largest_block_people = 6, households_cross_families = true, trait_type = ["right_censored_continuous"], components = ["additive_relationship", "person_level", "household", "residual"], intervals_per_replicate = 3, censoring_share = { min = 0.52, max = 0.52 }, true_additive_shares = [0.0, 0.2, 0.35, 0.6], true_variance = 4.0, replicates_per_cell = 300, nominal_coverage = 0.975, coverage_is_lower_end_only = true, family_wise_false_alarm_rate = 0.05, cells_sharing_the_band = 12, boundary_cell_reported_as_range = true, maximum_refusals = 0 }
