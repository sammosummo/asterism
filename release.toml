schema_version = 1
version = "0.1.1"
cargo_version = "0.1.1"
rust_toolchain = "1.97.1"
maturin_version = "1.14.1"
uv_version = "0.11.21"
release = true
requires_python = ">=3.13,<3.15"
scientific_pass_rules_configured = true
scientific_runner = "tools/run_scientific_release.py"

[artifacts.macos_arm64]
platform = "macos"
architecture = "arm64"
wheel = "abi3"

[artifacts.linux_x86_64]
platform = "linux"
architecture = "x86_64"
policy = "manylinux_2_17"
wheel = "abi3"

[medusa_smoke]
required = true
configured = true
architecture = "x86_64"
glibc_version = "2.28"
command = ["tools/medusa_wheel_smoke.py"]
evidence = "evidence/medusa-wheel-smoke-2026-08-24.json"

[synthetic_analysis_receipts]
configured = true
runner = "tools/synthetic_analysis_receipts.py"
timeout_seconds = 3600
analysis_ids = [
  "one_trait_gaussian_heritability",
  "several_covariance_components",
  "bivariate_genetic_correlation",
  "continuous_gene_by_environment",
  "discrete_gene_by_environment",
  "binary_liability_heritability",
  "one_trait_censored",
  "mixed_binary_censored_genetic_correlation",
]
evidence = []
blocker = { code = "standard_run_analysis_synthetic_receipts_unverified", evidence_needed = "Run the committed receipt command against the clean installed release wheel after every pass rule is measured, then retain one complete standard receipt per supported analysis in release evidence." }

[cross_platform_agreement]
configured = true
probe_runner = "tools/cross_platform_probe.py"
runner = "tools/compare_cross_platform.py"
exact_comparisons = [
  "outcome_status",
  "refusal_code",
  "boundary_state",
  "field_presence",
]

[[cross_platform_agreement.model_tolerances]]
analysis_id = "one_trait_gaussian_heritability"
measured = true
numeric_fields = [
  "fit.h2",
  "fit.total_variance",
  "fit.loglik",
  "fit.interval.lower",
