schema_version = 1
version = "0.1.0.dev0"
cargo_version = "0.1.0-dev.0"
rust_toolchain = "1.97.1"
maturin_version = "1.14.1"
uv_version = "0.11.21"
release = false
requires_python = ">=3.13,<3.15"
scientific_pass_rules_configured = false
scientific_runner = ""

[artifacts.macos_arm64]
platform = "macos"
architecture = "arm64"
wheel = "abi3"

[artifacts.linux_x86_64]
platform = "linux"
architecture = "x86_64"
policy = "manylinux_2_17"
wheel = "abi3"

[target_resource_budgets]
configured = false
runner = "tools/measure_target_resources.py"
route_helper = "tools/synthetic_analysis_receipts.py"
analysis_ids = [
  "one_trait_gaussian_heritability",
  "several_covariance_components",
  "bivariate_genetic_correlation",
  "continuous_gene_by_environment",
  "discrete_gene_by_environment",
  "binary_liability_heritability",
  "one_trait_tobit_audiogram",
  "mixed_binary_censored_genetic_correlation",
  "spatial_component_presence",
]
measurements = []
blocker = { code = "target_sized_time_and_memory_budgets_unmeasured", evidence_needed = "Measure every supported target-sized analysis on its intended host, then prewrite and enforce explicit wall-time and peak-memory budgets." }

[medusa_smoke]
required = true
configured = false
architecture = ""
glibc_version = ""
command = []
evidence = ""
blocker = { code = "medusa_architecture_glibc_and_wheel_smoke_unverified", evidence_needed = "Probe Medusa architecture and glibc, install the saved portable wheel, and retain a participant-free public import-and-fit smoke record." }

[synthetic_analysis_receipts]
configured = false
runner = "tools/synthetic_analysis_receipts.py"
timeout_seconds = 3600
analysis_ids = [
  "one_trait_gaussian_heritability",
  "several_covariance_components",
  "bivariate_genetic_correlation",
  "continuous_gene_by_environment",
  "discrete_gene_by_environment",
  "binary_liability_heritability",
  "one_trait_tobit_audiogram",
  "mixed_binary_censored_genetic_correlation",
  "spatial_component_presence",
]
evidence = []
blocker = { code = "standard_run_analysis_synthetic_receipts_unverified", evidence_needed = "Run the committed receipt command against the clean installed release wheel after every design range and pass rule is measured, then retain one reportable standard receipt per supported analysis in release evidence." }

[cross_platform_agreement]
configured = false
probe_runner = "tools/cross_platform_probe.py"
runner = "tools/compare_cross_platform.py"
exact_comparisons = [
  "outcome_status",
  "refusal_code",
  "boundary_state",
  "field_presence",
]

[[cross_platform_agreement.model_tolerances]]
analysis_id = "one_trait_gaussian_heritability"
measured = false
numeric_fields = [
  "fit.h2",
  "fit.total_variance",
  "fit.loglik",
  "fit.interval.lower",
  "fit.interval.upper",
  "fit.test.statistic",
  "fit.test.p_value",
]

