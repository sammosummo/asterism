[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "asterism"
version = "0.1.0.dev0"
description = "Variance-component models for quantitative genetics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
authors = [
  { name = "Samuel Mathias" },
]
keywords = [
  "quantitative genetics",
  "variance components",
  "heritability",
  "genetic correlation",
  "pedigree",
  "REML",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  # The guard. PyPI refuses any package carrying this, which is the point:
  # nothing can be distributed by accident. ADR 0018 takes it off, deliberately,
  # when a release is meant to go out with the papers that cite it.
  "Private :: Do Not Upload",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
    "numpy>=2",
]

[project.urls]
Repository = "https://github.com/sammosummo/asterism"
Documentation = "https://github.com/sammosummo/asterism/blob/main/README.md"
"API reference" = "https://github.com/sammosummo/asterism/blob/main/docs/api-reference.md"
"Statistical methods" = "https://github.com/sammosummo/asterism/blob/main/docs/statistical-methods.md"
"Numerical validation" = "https://github.com/sammosummo/asterism/blob/main/docs/numerical-validation.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "scipy>=1.15",
  "maturin==1.14.1",
  "ruff>=0.14",
]

# The Rust half is held to clippy's pedantic set. This is the same idea for the
# Python half, which had no gate at all.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # Standalone strings document the expression or block immediately above.
  "B018",
  # Line length is left to the formatter.
  "E501",
  # The prose here is British English and uses en and em dashes deliberately.
  # These rules read them as ambiguous look-alikes for a hyphen.
  "RUF002",
  "RUF003",
  # Statistical notation is short on purpose, the same reason the Rust half
  # allows single-character bindings: `l` is a Cholesky factor, not a stray.
  "E741",
  # A named lambda beside the equation it implements reads better than a nested
  # `def` in the middle of a numerical routine.
  "E731",
]

[tool.ruff.lint.isort]
# `synthetic` is the helper beside the examples, not a package from PyPI.
# Without this, ruff sorted it as third party and the fix flip-flopped.
known-local-folder = ["synthetic"]

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["python"]
module-name = "asterism._core"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports the repository's own `tools` package. Without this, only
# `tests/` reaches sys.path and `uv run pytest` -- the command automation uses
# -- cannot collect, while `uv run python -m pytest` can. One runner, one
# result.
pythonpath = ["."]
