name: Codebase quality

# Runs once per commit, not twice. An unfiltered `push:` fires on every branch,
# and `pull_request:` fires again for the same commit as soon as a pull request
# is open, so every commit on a branch under review ran this whole matrix twice.
# Restricting `push` to `main` leaves branches covered by `pull_request` alone
# and `main` covered by `push` alone.
#
# This is not tidiness. Hosted minutes are finite on a private repository and
# the Mac runners bill at ten times the Linux ones, so the duplicate half of
# every run was the larger share of the bill.
# Manual only. Asterism's GitHub Actions are switched off: the account does not
# pay for hosted minutes, so every automatic run failed before it started. The
# checks these workflows perform are run locally instead, by
# `sh tools/check_locally.sh`. Restore the triggers here only if hosted
# minutes are paid for.
on:
  workflow_dispatch:

# Supersede rather than accumulate. Pushing three commits in a minute otherwise
# leaves three full matrices running, and only the last one is about the code
# anybody will read. `main` is never cancelled: what ran there is the record of
# what was merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      # `--all-features` turns on the `python` feature, so both steps below
      # build pyo3 and need an interpreter at least as new as the `abi3-py313`
      # floor. Ubuntu 24.04 ships 3.12, on which pyo3 refuses to configure, so
      # without this the Rust half of this gate has never run: `cargo fmt`
      # passed, and clippy and the Rust suite both stopped in pyo3's build
      # script before reaching any of this crate's code.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Refuse Clippy warnings
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Run the complete Rust suite
        run: cargo test --release --locked --all-features

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.21"
      - name: Verify the locked environment
        run: uv lock --check
      - name: Install the locked development environment
        run: uv sync --locked --all-groups
      - name: Build the extension used by source-level tests
        run: uv run maturin develop --release --locked
      - name: Check Python formatting
        run: uv run ruff format --check python tests checks tools examples
      - name: Check Python lint
        run: uv run ruff check python tests checks tools examples
      - name: Check Asterism Python style
        run: uv run python tools/check_python_style.py
      - name: Check the generated API reference
        run: uv run python tools/build_api_reference.py --check
      - name: Check the generated model pages
        run: uv run python tools/build_model_pages.py --check
      - name: Check release metadata
        run: uv run python tools/check_release.py --metadata
      - name: Run the Python suite
        run: uv run pytest -q tests
